baseURL = 'https://example.com/'
locale = 'en-US'
title = 'S. Chris Colbert'
enableRobotsTXT = true

[[module.mounts]]
source = 'static'
target = 'static'
files = ['! **/.gitkeep']

[pagination]
pagerSize = 10

[taxonomies]
tag = 'tags'

[params]
description = 'Notes on engineering, development, faith, and life.'

[permalinks]
posts = '/posts/:slug/'

[markup.goldmark.renderer]
# Markdown-notation shortcodes emit HTML before Markdown rendering.
# Content is trusted, repository-authored input.
unsafe = true
